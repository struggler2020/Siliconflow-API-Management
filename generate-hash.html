<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>生成密码哈希</title>
</head>
<body>
    <h1>生成密码哈希工具</h1>
    <input type="text" id="password" placeholder="输入密码" value="admin123">
    <button onclick="generateHash()">生成哈希</button>
    <div id="result" style="margin-top: 20px; word-break: break-all;"></div>

    <script>
        async function hashPassword(password) {
            // 与 Worker 中完全相同的加密逻辑
            const encoder = new TextEncoder();
            const data = encoder.encode(password + 'salt');
            const hash = await crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode(...new Uint8Array(hash)));
        }

        async function generateHash() {
            const password = document.getElementById('password').value;
            const hash = await hashPassword(password);
            document.getElementById('result').innerHTML = `
                <h3>密码: ${password}</h3>
                <h3>哈希值:</h3>
                <code style="background: #f0f0f0; padding: 10px; display: block;">${hash}</code>
                <h3>SQL 更新语句:</h3>
                <code style="background: #f0f0f0; padding: 10px; display: block;">
                UPDATE admins SET password_hash = '${hash}' WHERE username = 'admin';
                </code>
            `;
        }

        // 页面加载时自动生成
        window.onload = () => generateHash();
    </script>
</body>
</html>
